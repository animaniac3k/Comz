<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Whisper • Private Notes</title>
  
  <style>
    :root {
      --bg: #0f1218;
      --card-bg: #191e28;
      --surface: #222937;
      --surface-hover: #2b3445;
      --border: #2e3748;
      --text-main: #f3f6fc;
      --text-muted: #9aa5b8;
      --text-subtle: #6e798d;
      
      /* Mode Dynamic Accent Tokens - Defaults to Encode (Emerald) */
      --mode-accent: #10b981;
      --mode-glow: rgba(16, 185, 129, 0.18);
      --mode-border: rgba(16, 185, 129, 0.4);
      --mode-badge-bg: rgba(16, 185, 129, 0.14);
      --mode-badge-text: #34d399;
      --output-box-text: #a7f3d0;
      
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --touch-min-h: 46px;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
    }

    /* Decoding theme mode (Warm Amber / Gold) */
    body.mode-decode {
      --mode-accent: #f59e0b;
      --mode-glow: rgba(245, 158, 11, 0.18);
      --mode-border: rgba(245, 158, 11, 0.4);
      --mode-badge-bg: rgba(245, 158, 11, 0.14);
      --mode-badge-text: #fbbf24;
      --output-box-text: #fde68a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 16px 28px;
      line-height: 1.5;
      transition: background-color 0.25s ease;
    }

    .container {
      width: 100%;
      max-width: 540px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 4px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-icon {
      width: 36px;
      height: 36px;
      background: var(--mode-badge-bg);
      border: 1px solid var(--mode-border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--mode-accent);
      transition: all 0.25s ease;
    }

    .app-icon svg {
      width: 20px;
      height: 20px;
    }

    .app-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-main);
    }

    .mode-indicator {
      font-size: 0.82rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
      background: var(--mode-badge-bg);
      color: var(--mode-badge-text);
      border: 1px solid var(--mode-border);
      transition: all 0.25s ease;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .tab-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--card-bg);
      padding: 5px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      gap: 6px;
    }

    .tab-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      min-height: var(--touch-min-h);
      padding: 10px 14px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn svg {
      width: 20px;
      height: 20px;
    }

    .tab-btn.active {
      background: var(--surface);
      color: var(--text-main);
      border-color: var(--mode-border);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
    }

    .tab-btn.active svg {
      color: var(--mode-accent);
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
      transition: border-color 0.25s ease;
    }

    .card.active-card {
      border-color: var(--mode-border);
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 22px;
    }

    .label-title {
      font-size: 0.88rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-field {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-size: 1.05rem; /* Large WhatsApp-comfortable reading size */
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
      -webkit-appearance: none;
    }

    .input-field:focus {
      border-color: var(--mode-accent);
      box-shadow: 0 0 0 3px var(--mode-glow);
    }

    .key-quick-btn {
      position: absolute;
      right: 8px;
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      min-width: 40px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      transition: all 0.15s;
    }

    .key-quick-btn:hover, .key-quick-btn:active {
      color: var(--text-main);
      border-color: var(--mode-accent);
    }

    .io-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    textarea.input-field {
      resize: vertical;
      min-height: 120px;
      line-height: 1.5;
      font-size: 1.05rem;
    }

    .char-count {
      font-size: 0.82rem;
      color: var(--text-subtle);
      font-weight: 500;
    }

    .output-box {
      background: #11141a;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 15px 16px;
      min-height: 120px;
      font-size: 1.05rem;
      line-height: 1.5;
      word-break: break-all;
      color: var(--output-box-text);
      white-space: pre-wrap;
      font-family: inherit;
      user-select: text;
      -webkit-user-select: text;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .output-box.empty {
      color: var(--text-subtle);
      font-style: italic;
    }

    .action-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .btn-icon {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      min-height: var(--touch-min-h);
      padding: 0 16px;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.05s;
      user-select: none;
    }

    .btn-icon:hover {
      background: var(--surface-hover);
      border-color: var(--text-muted);
    }

    .btn-icon:active {
      transform: scale(0.97);
    }

    .btn-icon svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .btn-icon.copied {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      color: #34d399;
    }

    .btn-icon.danger {
      color: #f87171;
    }

    .btn-icon.danger:hover {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.12);
    }

    /* Mode-themed primary copy button */
    .btn-icon.btn-primary {
      background: var(--surface);
      border-color: var(--mode-border);
      color: var(--text-main);
    }

    .btn-icon.btn-primary:hover {
      background: var(--mode-badge-bg);
    }

    /* Centered Swap Button Divider */
    .swap-divider {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 2px 0;
    }

    .btn-swap {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-swap:hover, .btn-swap:active {
      color: var(--mode-accent);
      border-color: var(--mode-accent);
      transform: rotate(180deg);
      background: var(--surface-hover);
    }

    .btn-swap svg {
      width: 20px;
      height: 20px;
    }

    /* Helpful non-intrusive hint */
    .permission-hint {
      display: none;
      background: rgba(59, 130, 246, 0.1);
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
      color: #93c5fd;
      padding: 10px 14px;
      font-size: 0.86rem;
      margin-top: 4px;
      line-height: 1.4;
    }

    /* Toast Notification for confirmations */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #1e293b;
      border: 1px solid var(--mode-border);
      color: var(--text-main);
      padding: 12px 22px;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    footer {
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-subtle);
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand-wrap">
        <div class="app-icon" id="app-badge-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1 class="app-title">Whisper</h1>
      </div>
      <div class="mode-indicator" id="mode-badge">Encode Mode</div>
    </header>

    <!-- Mode Selector with Emerald vs Amber theme feedback -->
    <nav class="tab-nav">
      <button class="tab-btn active" id="tab-encode" onclick="switchMode('encode')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"></path>
        </svg>
        <span>Encode Message</span>
      </button>
      <button class="tab-btn" id="tab-decode" onclick="switchMode('decode')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
        </svg>
        <span>Decode Message</span>
      </button>
    </nav>

    <section class="card active-card">
      <div class="label-row">
        <span class="label-title">Secret Passcode / Key</span>
        <span style="font-size: 0.8rem; color: var(--text-subtle);">Shared with recipient</span>
      </div>
      <div class="input-wrapper">
        <input 
          type="text" 
          id="secret-key" 
          class="input-field" 
          placeholder="e.g. 768 or secret word" 
          value="768"
          autocomplete="off" 
          autocapitalize="off" 
          spellcheck="false"
        >
        <button class="key-quick-btn" title="Generate New Key" onclick="generateRandomKey()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>
    </section>

    <main class="card">
      <!-- Input Section -->
      <div class="io-section">
        <div class="label-row">
          <span class="label-title" id="input-label">Original Text</span>
          <span class="char-count" id="input-count">0 chars</span>
        </div>
        <textarea 
          id="input-text" 
          class="input-field" 
          placeholder="Type or paste message here..."
        ></textarea>
        
        <div class="permission-hint" id="paste-hint">
          <strong>Tip:</strong> Tap inside the box above to use your phone's native <strong>Paste</strong> popup.
        </div>

        <div class="action-bar">
          <button class="btn-icon" id="btn-paste" onclick="pasteFromClipboard()" title="Paste from clipboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
            </svg>
            <span id="paste-label">Paste</span>
          </button>
          <button class="btn-icon danger" onclick="clearInput()" title="Clear message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            <span>Clear</span>
          </button>
        </div>
      </div>

      <!-- Quick Swap Divider -->
      <div class="swap-divider">
        <button class="btn-swap" onclick="swapInputOutput()" title="Switch Input & Output">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 16V4m0 0L3 8m4-4l4 4m6 4v12m0 0l4-4m-4 4l-4-4"></path>
          </svg>
        </button>
      </div>

      <!-- Output Section -->
      <div class="io-section">
        <div class="label-row">
          <span class="label-title" id="output-label">Encoded Result</span>
          <span class="char-count" id="output-count">0 chars</span>
        </div>
        <div class="output-box empty" id="output-text">Result will appear here...</div>

        <div class="action-bar">
          <button class="btn-icon btn-primary" id="btn-copy" onclick="copyResult()" title="Copy result">
            <svg id="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span id="copy-label">Copy</span>
          </button>
          <button class="btn-icon" id="btn-share" onclick="shareResult()" title="Share result">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            <span>Share</span>
          </button>
        </div>
      </div>
    </main>

    <footer>
      Private • Works entirely in your browser
    </footer>
  </div>

  <div id="toast">Copied to clipboard</div>

  <script>
    let currentMode = 'encode'; // 'encode' or 'decode'
    const START_CHAR = 32;       // Printable space ' '
    const END_CHAR = 126;        // Printable tilde '~'
    const RANGE = END_CHAR - START_CHAR + 1; // 95 printable chars

    const inputArea = document.getElementById('input-text');
    const outputBox = document.getElementById('output-text');
    const keyInput = document.getElementById('secret-key');
    const inputCount = document.getElementById('input-count');
    const outputCount = document.getElementById('output-count');
    const toast = document.getElementById('toast');
    const pasteHint = document.getElementById('paste-hint');

    // Parse passcode into a shift offset
    function parseKey(keyStr) {
      if (!keyStr || keyStr.length === 0) return 0;
      
      const parsedNum = parseInt(keyStr, 10);
      if (!isNaN(parsedNum) && /^-?\d+$/.test(keyStr.trim())) {
        return ((parsedNum % RANGE) + RANGE) % RANGE;
      }

      // If passphrase or word, compute deterministic shift
      let hash = 0;
      for (let i = 0; i < keyStr.length; i++) {
        hash = (hash * 31 + keyStr.charCodeAt(i)) % RANGE;
      }
      return (hash + RANGE) % RANGE;
    }

    // Bidirectional character transform
    function transformMessage(text, keyStr, isEncoding) {
      if (!text) return '';
      const shift = parseKey(keyStr);
      let result = '';

      for (let i = 0; i < text.length; i++) {
        const code = text.charCodeAt(i);
        if (code >= START_CHAR && code <= END_CHAR) {
          const zeroIndexed = code - START_CHAR;
          let transformed;
          if (isEncoding) {
            transformed = (zeroIndexed + shift) % RANGE;
          } else {
            transformed = (zeroIndexed - shift) % RANGE;
            if (transformed < 0) transformed += RANGE;
          }
          result += String.fromCharCode(transformed + START_CHAR);
        } else {
          // Preserve spaces/tabs/returns or special unicode
          result += text[i];
        }
      }
      return result;
    }

    function processText() {
      const text = inputArea.value;
      const key = keyInput.value;
      const isEncoding = (currentMode === 'encode');

      inputCount.textContent = `${text.length} chars`;

      if (!text) {
        outputBox.textContent = 'Result will appear here...';
        outputBox.classList.add('empty');
        outputCount.textContent = '0 chars';
        return;
      }

      const result = transformMessage(text, key, isEncoding);
      outputBox.textContent = result;
      outputBox.classList.remove('empty');
      outputCount.textContent = `${result.length} chars`;
    }

    function switchMode(mode) {
      currentMode = mode;
      
      const tabEncode = document.getElementById('tab-encode');
      const tabDecode = document.getElementById('tab-decode');
      const inputLabel = document.getElementById('input-label');
      const outputLabel = document.getElementById('output-label');
      const modeBadge = document.getElementById('mode-badge');

      if (mode === 'encode') {
        document.body.classList.remove('mode-decode');
        tabEncode.classList.add('active');
        tabDecode.classList.remove('active');
        modeBadge.textContent = 'Encode Mode';
        inputLabel.textContent = 'Original Message';
        outputLabel.textContent = 'Encoded Result';
        inputArea.placeholder = 'Type your message to encode...';
      } else {
        document.body.classList.add('mode-decode');
        tabDecode.classList.add('active');
        tabEncode.classList.remove('active');
        modeBadge.textContent = 'Decode Mode';
        inputLabel.textContent = 'Encoded Message';
        outputLabel.textContent = 'Decoded Result';
        inputArea.placeholder = 'Paste encoded message to decode...';
      }

      processText();
    }

    function generateRandomKey() {
      const rand = Math.floor(Math.random() * 900) + 100;
      keyInput.value = rand;
      showToast(`Key set to ${rand}`);
      processText();
    }

    function clearInput() {
      inputArea.value = '';
      pasteHint.style.display = 'none';
      processText();
      inputArea.focus();
    }

    function swapInputOutput() {
      if (outputBox.classList.contains('empty') || !outputBox.textContent) return;
      const currentOutput = outputBox.textContent;
      
      switchMode(currentMode === 'encode' ? 'decode' : 'encode');
      inputArea.value = currentOutput;
      processText();
      showToast('Swapped input & output');
    }

    async function copyResult() {
      if (outputBox.classList.contains('empty') || !outputBox.textContent) {
        showToast('Nothing to copy yet');
        return;
      }

      const text = outputBox.textContent;
      let copied = false;

      // Primary: Modern Async Clipboard API
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          copied = true;
        } catch (err) {
          copied = false;
        }
      }

      // Fallback: execCommand with invisible DOM textarea
      if (!copied) {
        try {
          const tempArea = document.createElement('textarea');
          tempArea.value = text;
          tempArea.style.position = 'fixed';
          tempArea.style.left = '-9999px';
          tempArea.style.top = '0';
          tempArea.setAttribute('readonly', '');
          document.body.appendChild(tempArea);
          tempArea.focus();
          tempArea.select();
          tempArea.setSelectionRange(0, 999999);
          copied = document.execCommand('copy');
          document.body.removeChild(tempArea);
        } catch (e) {
          copied = false;
        }
      }

      if (copied) {
        triggerCopyFeedback();
        showToast('Copied to clipboard');
      } else {
        showToast('Press & hold text to copy');
      }
    }

    function triggerCopyFeedback() {
      const copyBtn = document.getElementById('btn-copy');
      const copyLabel = document.getElementById('copy-label');
      const copyIcon = document.getElementById('copy-icon');

      copyBtn.classList.add('copied');
      copyLabel.textContent = 'Copied!';
      copyIcon.innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';

      setTimeout(() => {
        copyBtn.classList.remove('copied');
        copyLabel.textContent = 'Copy';
        copyIcon.innerHTML = '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>';
      }, 1600);
    }

    async function pasteFromClipboard() {
      let pasted = false;

      if (navigator.clipboard && navigator.clipboard.readText) {
        try {
          const text = await navigator.clipboard.readText();
          if (text) {
            inputArea.value = text;
            pasteHint.style.display = 'none';
            processText();
            showToast('Pasted from clipboard');
            pasted = true;
          }
        } catch (err) {
          pasted = false;
        }
      }

      if (!pasted) {
        pasteHint.style.display = 'block';
        inputArea.focus();
        showToast('Tap text box to paste');
      }
    }

    async function shareResult() {
      if (outputBox.classList.contains('empty') || !outputBox.textContent) {
        showToast('Nothing to share yet');
        return;
      }

      const text = outputBox.textContent;

      if (navigator.share) {
        try {
          await navigator.share({
            title: 'Whisper Message',
            text: text
          });
        } catch (err) {
          // User canceled or dismissed
        }
      } else {
        copyResult();
      }
    }

    let toastTimer;
    function showToast(msg) {
      clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.classList.add('show');
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    inputArea.addEventListener('input', () => {
      pasteHint.style.display = 'none';
      processText();
    });
    keyInput.addEventListener('input', processText);

    // Initial render
    processText();
  </script>
</body>
</html>
