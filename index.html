<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Whisper • Private Notes</title>
  
  <style>
    :root {
      /* Base Theme: Slate Classic */
      --bg: #0e1117;
      --card-bg: #181d26;
      --surface: #222835;
      --surface-hover: #2b3342;
      --border: #2d3646;
      --text-main: #f3f6fc;
      --text-muted: #9ba7ba;
      --text-subtle: #6d788c;
      
      /* Mode Dynamic Tokens - Encode Mode (Warm Amber / Gold) */
      --mode-accent: #f59e0b;
      --mode-glow: rgba(245, 158, 11, 0.2);
      --mode-border: rgba(245, 158, 11, 0.45);
      --mode-badge-bg: rgba(245, 158, 11, 0.15);
      --mode-badge-text: #fbbf24;
      --output-box-text: #fde68a;
      
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-hebrew: "Segoe UI Hebrew", "Arial Hebrew", "David", "SBL Hebrew", -apple-system, sans-serif;
      --touch-min-h: 46px;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
    }

    /* Decode Mode Tokens (Emerald / Mint Green) */
    body.mode-decode {
      --mode-accent: #10b981;
      --mode-glow: rgba(16, 185, 129, 0.2);
      --mode-border: rgba(16, 185, 129, 0.45);
      --mode-badge-bg: rgba(16, 185, 129, 0.15);
      --mode-badge-text: #34d399;
      --output-box-text: #a7f3d0;
    }

    /* Feminine Theme: Rose & Warm Quartz */
    body.theme-rose {
      --bg: #150f16;
      --card-bg: #211624;
      --surface: #2e1e32;
      --surface-hover: #3b2840;
      --border: #442a4a;
      --text-main: #fbf5fc;
      --text-muted: #c9afcd;
      --text-subtle: #8e7392;
    }

    /* Feminine + Encode (Soft Peach Amber) */
    body.theme-rose:not(.mode-decode) {
      --mode-accent: #f97316;
      --mode-glow: rgba(249, 115, 22, 0.22);
      --mode-border: rgba(249, 115, 22, 0.45);
      --mode-badge-bg: rgba(249, 115, 22, 0.15);
      --mode-badge-text: #fdba74;
      --output-box-text: #fed7aa;
    }

    /* Feminine + Decode (Mint Sage Orchid) */
    body.theme-rose.mode-decode {
      --mode-accent: #2dd4bf;
      --mode-glow: rgba(45, 212, 191, 0.22);
      --mode-border: rgba(45, 212, 191, 0.45);
      --mode-badge-bg: rgba(45, 212, 191, 0.15);
      --mode-badge-text: #5eead4;
      --output-box-text: #99f6e4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 14px 28px;
      line-height: 1.5;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .container {
      width: 100%;
      max-width: 530px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-icon {
      width: 38px;
      height: 38px;
      background: var(--mode-badge-bg);
      border: 1.5px solid var(--mode-border);
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--mode-accent);
      transition: all 0.25s ease;
    }

    .app-icon svg {
      width: 21px;
      height: 21px;
    }

    .app-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-main);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Style Switcher Pill */
    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 9999px;
      padding: 5px 11px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .theme-toggle-btn:hover {
      color: var(--text-main);
      border-color: var(--mode-border);
    }

    .theme-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--mode-accent);
      box-shadow: 0 0 6px var(--mode-accent);
    }

    .mode-indicator {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
      background: var(--mode-badge-bg);
      color: var(--mode-badge-text);
      border: 1px solid var(--mode-border);
      transition: all 0.25s ease;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    /* Navigation Tabs */
    .tab-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--card-bg);
      padding: 5px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      gap: 6px;
    }

    .tab-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      min-height: var(--touch-min-h);
      padding: 10px 12px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .tab-btn.active {
      background: var(--surface);
      color: var(--text-main);
      border-color: var(--mode-border);
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
    }

    .tab-btn.active svg {
      color: var(--mode-accent);
    }

    /* Cards & Inputs */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.28);
      transition: border-color 0.25s ease, background-color 0.25s ease;
    }

    .card.active-card {
      border-color: var(--mode-border);
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 22px;
    }

    .label-title {
      font-size: 0.88rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-field {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-size: 1.05rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
      font-family: inherit;
      -webkit-appearance: none;
    }

    .key-actions-wrap {
      position: absolute;
      right: 7px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .key-quick-btn {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      min-width: 42px;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      transition: all 0.15s;
    }

    .key-quick-btn:hover, .key-quick-btn:active {
      color: var(--text-main);
      border-color: var(--mode-accent);
    }

    .io-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    textarea.input-field {
      resize: vertical;
      min-height: 125px;
      line-height: 1.55;
      font-size: 1.08rem;
    }

    .char-count {
      font-size: 0.82rem;
      color: var(--text-subtle);
      font-weight: 500;
    }

    .output-box {
      background: rgba(0, 0, 0, 0.28);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 15px 16px;
      min-height: 125px;
      font-size: 1.12rem;
      line-height: 1.6;
      word-break: break-all;
      color: var(--output-box-text);
      white-space: pre-wrap;
      font-family: var(--font-hebrew);
      letter-spacing: 0.04em;
      user-select: text;
      -webkit-user-select: text;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .output-box.decoded-view {
      font-family: var(--font-family);
      letter-spacing: normal;
    }

    .output-box.empty {
      color: var(--text-subtle);
      font-style: italic;
      font-family: var(--font-family);
      letter-spacing: normal;
    }

    .action-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .btn-icon {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      min-height: var(--touch-min-h);
      padding: 0 16px;
      border-radius: var(--radius-sm);
      font-size: 0.98rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.05s;
      user-select: none;
    }

    .btn-icon:hover {
      background: var(--surface-hover);
      border-color: var(--text-muted);
    }

    .btn-icon:active {
      transform: scale(0.97);
    }

    .btn-icon svg {
      width: 19px;
      height: 19px;
      flex-shrink: 0;
    }

    .btn-icon.copied {
      background: var(--mode-badge-bg);
      border-color: var(--mode-accent);
      color: var(--mode-badge-text);
    }

    .btn-icon.danger {
      color: #f87171;
    }

    .btn-icon.danger:hover {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.14);
    }

    .btn-icon.btn-primary {
      background: var(--surface);
      border-color: var(--mode-border);
      color: var(--text-main);
    }

    .btn-icon.btn-primary:hover {
      background: var(--mode-badge-bg);
    }

    .swap-divider {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 2px 0;
    }

    .btn-swap {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn-swap:hover, .btn-swap:active {
      color: var(--mode-accent);
      border-color: var(--mode-accent);
      transform: rotate(180deg);
      background: var(--surface-hover);
    }

    .btn-swap svg {
      width: 22px;
      height: 22px;
    }

    .permission-hint {
      display: none;
      background: rgba(59, 130, 246, 0.1);
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
      color: #93c5fd;
      padding: 10px 14px;
      font-size: 0.88rem;
      margin-top: 4px;
      line-height: 1.4;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: var(--card-bg);
      border: 1.5px solid var(--mode-border);
      color: var(--text-main);
      padding: 12px 22px;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    footer {
      text-align: center;
      font-size: 0.84rem;
      color: var(--text-subtle);
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand-wrap">
        <div class="app-icon" id="app-badge-icon">
          <!-- Ambient Lock/Script Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1 class="app-title">Whisper</h1>
      </div>
      
      <div class="header-controls">
        <button class="theme-toggle-btn" id="theme-btn" onclick="togglePalette()" title="Toggle Color Theme">
          <span class="theme-dot"></span>
          <span id="theme-name">Classic</span>
        </button>
        <div class="mode-indicator" id="mode-badge">Encode Mode</div>
      </div>
    </header>

    <!-- Mode Selector: Encode (Amber) vs Decode (Emerald) -->
    <nav class="tab-nav">
      <button class="tab-btn active" id="tab-encode" onclick="switchMode('encode')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"></path>
        </svg>
        <span>Encode Message</span>
      </button>
      <button class="tab-btn" id="tab-decode" onclick="switchMode('decode')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
        </svg>
        <span>Decode Message</span>
      </button>
    </nav>

    <!-- Passcode Section -->
    <section class="card active-card">
      <div class="label-row">
        <span class="label-title">Secret Passcode / Key</span>
        <span style="font-size: 0.82rem; color: var(--text-subtle);">Shared with recipient</span>
      </div>
      <div class="input-wrapper">
        <input 
          type="password" 
          id="secret-key" 
          class="input-field" 
          placeholder="e.g. 768 or secret word" 
          value="768"
          autocomplete="off" 
          autocapitalize="off" 
          spellcheck="false"
          style="padding-right: 98px;"
        >
        <div class="key-actions-wrap">
          <button class="key-quick-btn" id="toggle-key-visibility" title="Show or hide passcode" onclick="toggleKeyVisibility()">
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
          <button class="key-quick-btn" title="Generate New Key" onclick="generateRandomKey()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <!-- Main Message Card -->
    <main class="card">
      <!-- Input Section -->
      <div class="io-section">
        <div class="label-row">
          <span class="label-title" id="input-label">Original Text</span>
          <span class="char-count" id="input-count">0 chars</span>
        </div>
        <textarea 
          id="input-text" 
          class="input-field" 
          placeholder="Type your message in English..."
        ></textarea>
        
        <div class="permission-hint" id="paste-hint">
          <strong>Tip:</strong> Tap inside the box above to use your phone's native <strong>Paste</strong> option.
        </div>

        <div class="action-bar">
          <button class="btn-icon" id="btn-paste" onclick="pasteFromClipboard()" title="Paste from clipboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
            </svg>
            <span id="paste-label">Paste</span>
          </button>
          <button class="btn-icon danger" onclick="clearInput()" title="Clear message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            <span>Clear</span>
          </button>
        </div>
      </div>

      <!-- Quick Swap Divider -->
      <div class="swap-divider">
        <button class="btn-swap" onclick="swapInputOutput()" title="Switch Input & Output">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 16V4m0 0L3 8m4-4l4 4m6 4v12m0 0l4-4m-4 4l-4-4"></path>
          </svg>
        </button>
      </div>

      <!-- Output Section -->
      <div class="io-section">
        <div class="label-row">
          <span class="label-title" id="output-label">Encoded Result (Script)</span>
          <span class="char-count" id="output-count">0 chars</span>
        </div>
        <div class="output-box empty" id="output-text">Result will appear here...</div>

        <div class="action-bar">
          <button class="btn-icon btn-primary" id="btn-copy" onclick="copyResult()" title="Copy result">
            <svg id="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span id="copy-label">Copy</span>
          </button>
          <button class="btn-icon" id="btn-share" onclick="shareResult()" title="Share result">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            <span>Share</span>
          </button>
        </div>
      </div>
    </main>

    <footer>
      Private • Works entirely in your browser
    </footer>
  </div>

  <div id="toast">Copied to clipboard</div>

  <script>
    let currentMode = 'encode'; // 'encode' (Warm Amber) or 'decode' (Emerald)
    let currentPalette = 'classic'; // 'classic' or 'rose'

    /*
      The Hebrew alphabet comprises 22 standard letters (Alef to Tav, U+05D0 to U+05EA)
      plus 5 sofit / final letter forms (Khaf, Mem, Nun, Pe, Tsadi).
      
      We construct a 26-character sequence of Hebrew letters corresponding to 
      the 26 English alphabet letters (A-Z):
      Index 0..21: The 22 standard Hebrew letters
      Index 22..25: The first 4 final forms (ך, ם, ן, ף)
      This provides a direct 1:1 reversible mapping with 26 letters!
      
      To preserve Latin capitalization reversibly without altering text flow,
      uppercase letters get a subtle, standard Hebrew vowel point (Dagesh / dot U+05BC).
      Lower-case letters remain plain Hebrew characters.
      Numbers, punctuation, linebreaks, and symbols remain untouched.
    */
    const HEBREW_ALPHABET = [
      '\u05D0', // 0: Alef  -> a
      '\u05D1', // 1: Bet   -> b
      '\u05D2', // 2: Gimel -> c
      '\u05D3', // 3: Dalet -> d
      '\u05D4', // 4: He    -> e
      '\u05D5', // 5: Vav   -> f
      '\u05D6', // 6: Zayin -> g
      '\u05D7', // 7: Het   -> h
      '\u05D8', // 8: Tet   -> i
      '\u05D9', // 9: Yod   -> j
      '\u05DA', // 10: Kaf  -> k
      '\u05DC', // 11: Lamed-> l
      '\u05DD', // 12: Mem  -> m
      '\u05DE', // 13: Nun  -> n
      '\u05DF', // 14: Samekh -> o
      '\u05E0', // 15: Ayin -> p
      '\u05E1', // 16: Pe   -> q
      '\u05E2', // 17: Tsadi-> r
      '\u05E3', // 18: Qof  -> s
      '\u05E4', // 19: Resh -> t
      '\u05E5', // 20: Shin -> u
      '\u05E6', // 21: Tav  -> v
      '\u05E7', // 22: Qof2 / Sofit Kaf -> w
      '\u05E8', // 23: Resh2 / Sofit Mem -> x
      '\u05E9', // 24: Shin2 / Sofit Nun -> y
      '\u05EA'  // 25: Tav2 / Sofit Pe  -> z
    ];

    const DAGESH_MARK = '\u05BC'; // Marks uppercase letter in Hebrew

    // Build reverse map for fast O(1) lookup
    const HEBREW_TO_INDEX = new Map();
    HEBREW_ALPHABET.forEach((char, idx) => {
      HEBREW_TO_INDEX.set(char, idx);
    });

    const inputArea = document.getElementById('input-text');
    const outputBox = document.getElementById('output-text');
    const keyInput = document.getElementById('secret-key');
    const inputCount = document.getElementById('input-count');
    const outputCount = document.getElementById('output-count');
    const toast = document.getElementById('toast');
    const pasteHint = document.getElementById('paste-hint');

    // Parse passcode into a shift offset modulo 26
    function parseShift(keyStr) {
      if (!keyStr || keyStr.length === 0) return 0;
      
      const parsedNum = parseInt(keyStr, 10);
      if (!isNaN(parsedNum) && /^-?\d+$/.test(keyStr.trim())) {
        return ((parsedNum % 26) + 26) % 26;
      }

      // If passphrase or word, compute deterministic shift hash
      let hash = 0;
      for (let i = 0; i < keyStr.length; i++) {
        hash = (hash * 31 + keyStr.charCodeAt(i)) % 26;
      }
      return (hash + 26) % 26;
    }

    function encodeToHebrew(text, keyStr) {
      if (!text) return '';
      const shift = parseShift(keyStr);
      let result = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const code = text.charCodeAt(i);

        if (code >= 65 && code <= 90) {
          // Uppercase Latin (A-Z)
          const index = code - 65;
          const shiftedIndex = (index + shift) % 26;
          // Attach Dagesh mark to designate uppercase
          result += HEBREW_ALPHABET[shiftedIndex] + DAGESH_MARK;
        } else if (code >= 97 && code <= 122) {
          // Lowercase Latin (a-z)
          const index = code - 97;
          const shiftedIndex = (index + shift) % 26;
          result += HEBREW_ALPHABET[shiftedIndex];
        } else {
          // Numbers, punctuation, emojis, spaces preserved untouched
          result += char;
        }
      }
      return result;
    }

    function decodeFromHebrew(text, keyStr) {
      if (!text) return '';
      const shift = parseShift(keyStr);
      let result = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];

        if (HEBREW_TO_INDEX.has(char)) {
          const index = HEBREW_TO_INDEX.get(char);
          const originalIndex = (index - shift + 26) % 26;

          // Check if followed by uppercase mark (Dagesh)
          const hasUppercaseMark = (i + 1 < text.length && text[i + 1] === DAGESH_MARK);
          if (hasUppercaseMark) {
            result += String.fromCharCode(65 + originalIndex);
            i++; // skip past the dagesh
          } else {
            result += String.fromCharCode(97 + originalIndex);
          }
        } else if (char === DAGESH_MARK) {
          // Stray mark ignored if encountered out-of-order
          continue;
        } else {
          // Non-encoded character (punctuation, numbers, spacing)
          result += char;
        }
      }
      return result;
    }

    function processText() {
      const text = inputArea.value;
      const key = keyInput.value;
      const isEncoding = (currentMode === 'encode');

      inputCount.textContent = `${text.length} chars`;

      if (!text) {
        outputBox.textContent = 'Result will appear here...';
        outputBox.classList.add('empty');
        outputBox.classList.remove('decoded-view');
        outputCount.textContent = '0 chars';
        return;
      }

      const result = isEncoding ? encodeToHebrew(text, key) : decodeFromHebrew(text, key);
      outputBox.textContent = result;
      outputBox.classList.remove('empty');

      if (isEncoding) {
        outputBox.classList.remove('decoded-view');
      } else {
        outputBox.classList.add('decoded-view');
      }

      outputCount.textContent = `${result.length} chars`;
    }

    function switchMode(mode) {
      currentMode = mode;
      
      const tabEncode = document.getElementById('tab-encode');
      const tabDecode = document.getElementById('tab-decode');
      const inputLabel = document.getElementById('input-label');
      const outputLabel = document.getElementById('output-label');
      const modeBadge = document.getElementById('mode-badge');

      if (mode === 'encode') {
        // ENCODE = Warm Amber
        document.body.classList.remove('mode-decode');
        tabEncode.classList.add('active');
        tabDecode.classList.remove('active');
        modeBadge.textContent = 'Encode Mode';
        inputLabel.textContent = 'Original Message (English)';
        outputLabel.textContent = 'Encoded Result (Script)';
        inputArea.placeholder = 'Type your message in English...';
      } else {
        // DECODE = Emerald Green
        document.body.classList.add('mode-decode');
        tabDecode.classList.add('active');
        tabEncode.classList.remove('active');
        modeBadge.textContent = 'Decode Mode';
        inputLabel.textContent = 'Encoded Message (Script)';
        outputLabel.textContent = 'Decoded Result (English)';
        inputArea.placeholder = 'Paste encoded script here to decode...';
      }

      processText();
    }

    // Palette Switcher: Classic (Slate) vs Rose
    function togglePalette() {
      const themeBtnName = document.getElementById('theme-name');
      if (currentPalette === 'classic') {
        currentPalette = 'rose';
        document.body.classList.add('theme-rose');
        themeBtnName.textContent = 'Rose';
        showToast('Switched to Rose style');
      } else {
        currentPalette = 'classic';
        document.body.classList.remove('theme-rose');
        themeBtnName.textContent = 'Classic';
        showToast('Switched to Classic style');
      }
    }

    function toggleKeyVisibility() {
      const eyeIcon = document.getElementById('eye-icon');
      if (keyInput.type === 'password') {
        keyInput.type = 'text';
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
        showToast('Passcode revealed');
      } else {
        keyInput.type = 'password';
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
        showToast('Passcode hidden');
      }
    }

    function generateRandomKey() {
      const rand = Math.floor(Math.random() * 900) + 100;
      keyInput.value = rand;
      showToast(`Key set to ${rand}`);
      processText();
    }

    function clearInput() {
      inputArea.value = '';
      pasteHint.style.display = 'none';
      processText();
      inputArea.focus();
    }

    function swapInputOutput() {
      if (outputBox.classList.contains('empty') || !outputBox.textContent) return;
      const currentOutput = outputBox.textContent;
      
      switchMode(currentMode === 'encode' ? 'decode' : 'encode');
      inputArea.value = currentOutput;
      processText();
      showToast('Swapped input & output');
    }

    async function copyResult() {
      if (outputBox.classList.contains('empty') || !outputBox.textContent) {
        showToast('Nothing to copy yet');
        return;
      }

      const text = outputBox.textContent;
      let copied = false;

      // Primary: Modern Clipboard API
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          copied = true;
        } catch (err) {
          copied = false;
        }
      }

      // Fallback: execCommand with DOM textarea
      if (!copied) {
        try {
          const tempArea = document.createElement('textarea');
          tempArea.value = text;
          tempArea.style.position = 'fixed';
          tempArea.style.left = '-9999px';
          tempArea.style.top = '0';
          tempArea.setAttribute('readonly', '');
          document.body.appendChild(tempArea);
          tempArea.focus();
          tempArea.select();
          tempArea.setSelectionRange(0, 999999);
          copied = document.execCommand('copy');
          document.body.removeChild(tempArea);
        } catch (e) {
          copied = false;
        }
      }

      if (copied) {
        triggerCopyFeedback();
        showToast('Copied to clipboard');
      } else {
        showToast('Press & hold text to copy');
      }
    }

    function triggerCopyFeedback() {
      const copyBtn = document.getElementById('btn-copy');
      const copyLabel = document.getElementById('copy-label');
      const copyIcon = document.getElementById('copy-icon');

      copyBtn.classList.add('copied');
      copyLabel.textContent = 'Copied!';
      copyIcon.innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';

      setTimeout(() => {
        copyBtn.classList.remove('copied');
        copyLabel.textContent = 'Copy';
        copyIcon.innerHTML = '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>';
      }, 1600);
    }

    async function pasteFromClipboard() {
      let pasted = false;

      if (navigator.clipboard && navigator.clipboard.readText) {
        try {
          const text = await navigator.clipboard.readText();
          if (text) {
            inputArea.value = text;
            pasteHint.style.display = 'none';
            processText();
            showToast('Pasted from clipboard');
            pasted = true;
          }
        } catch (err) {
          pasted = false;
        }
      }

      if (!pasted) {
        pasteHint.style.display = 'block';
        inputArea.focus();
        showToast('Tap text box to paste');
      }
    }

    async function shareResult() {
      if (outputBox.classList.contains('empty') || !outputBox.textContent) {
        showToast('Nothing to share yet');
        return;
      }

      const text = outputBox.textContent;

      if (navigator.share) {
        try {
          await navigator.share({
            title: 'Whisper Message',
            text: text
          });
        } catch (err) {
          // User cancelled
        }
      } else {
        copyResult();
      }
    }

    let toastTimer;
    function showToast(msg) {
      clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.classList.add('show');
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    // Attach real-time listeners
    inputArea.addEventListener('input', () => {
      pasteHint.style.display = 'none';
      processText();
    });
    keyInput.addEventListener('input', processText);

    // Initial render
    processText();
  </script>
</body>
</html>
