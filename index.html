<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Whisper • Private Notes</title>
  <meta name="description" content="Encode and decode private notes directly in your browser.">
  <meta name="theme-color" content="#0e1117">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Whisper">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <header>
      <div class="brand-wrap">
        <div class="app-icon" id="app-badge-icon">
          <img src="icons/icon.svg" alt="">
        </div>
        <h1 class="app-title">Whisper</h1>
      </div>
      
      <div class="header-controls">
        <button class="theme-toggle-btn" id="theme-btn" title="Toggle Color Theme">
          <span class="theme-dot"></span>
          <span id="theme-name">Classic</span>
        </button>
        <div class="mode-indicator" id="mode-badge">Encode Mode</div>
      </div>
    </header>

    <!-- Mode Selector: Encode (Amber) vs Decode (Emerald) -->
    <nav class="tab-nav">
      <button class="tab-btn active" id="tab-encode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"></path>
        </svg>
        <span>Encode Message</span>
      </button>
      <button class="tab-btn" id="tab-decode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
        </svg>
        <span>Decode Message</span>
      </button>
    </nav>

    <!-- Passcode Section -->
    <section class="card active-card">
      <div class="label-row">
        <span class="label-title">Secret Passcode / Key</span>
        <span class="key-hint">Shared with recipient</span>
      </div>
      <div class="input-wrapper">
        <input 
          type="password" 
          id="secret-key" 
          placeholder="e.g. 768 or secret word" 
          value="768"
          autocomplete="off" 
          autocapitalize="off" 
          spellcheck="false"
          class="input-field secret-key-input"
        >
        <div class="key-actions-wrap">
          <button class="key-quick-btn" id="toggle-key-visibility" title="Show or hide passcode">
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
          <button class="key-quick-btn" id="generate-key-btn" title="Generate New Key">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <!-- Main Message Card -->
    <main class="card">
      <!-- Input Section -->
      <div class="io-section">
        <div class="label-row">
          <span class="label-title" id="input-label">Original Text</span>
          <span class="char-count" id="input-count">0 chars</span>
        </div>
        <textarea 
          id="input-text" 
          class="input-field" 
          placeholder="Type your message in English..."
        ></textarea>
        
        <div class="permission-hint" id="paste-hint">
          <strong>Tip:</strong> Tap inside the box above to use your phone's native <strong>Paste</strong> option.
        </div>

        <div class="action-bar">
          <button class="btn-icon" id="btn-paste" title="Paste from clipboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
            </svg>
            <span id="paste-label">Paste</span>
          </button>
          <button class="btn-icon danger" id="btn-clear" title="Clear message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            <span>Clear</span>
          </button>
        </div>
      </div>

      <!-- Quick Swap Divider -->
      <div class="swap-divider">
        <button class="btn-swap" id="btn-swap" title="Switch Input & Output">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 16V4m0 0L3 8m4-4l4 4m6 4v12m0 0l4-4m-4 4l-4-4"></path>
          </svg>
        </button>
      </div>

      <!-- Output Section -->
      <div class="io-section">
        <div class="label-row">
          <span class="label-title" id="output-label">Encoded Result (Script)</span>
          <span class="char-count" id="output-count">0 chars</span>
        </div>
        <div class="output-box empty" id="output-text">Result will appear here...</div>

        <div class="action-bar">
          <button class="btn-icon btn-primary" id="btn-copy" title="Copy result">
            <svg id="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span id="copy-label">Copy</span>
          </button>
          <button class="btn-icon" id="btn-share" title="Share result">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            <span>Share</span>
          </button>
        </div>
      </div>
    </main>

    <footer>
      Private • Works entirely in your browser
    </footer>
  </div>

  <div id="toast">Copied to clipboard</div>

  <script src="script.js" defer></script>
</body>
</html>
